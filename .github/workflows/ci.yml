name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/boltffi
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install BoltFFI CLI
        # A cache restored through the fallback key may hold an older CLI, so check the version, not just presence.
        run: boltffi --version 2>/dev/null | grep -qx 'boltffi 0.32.0' || cargo install boltffi_cli --version 0.32.0 --locked --force

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Build XCFramework
        run: ./scripts/build-xcframework.sh

      - name: Generated bindings are up to date
        run: git diff --exit-code -- Sources/

      - name: "Swift tests (macOS: ZDTaffy, ZDLayoutCore, ZDLayoutSwiftUI, ZDLayoutAppKit)"
        run: swift test

      - name: "Swift tests (iOS Simulator: ZDLayout)"
        run: |
          # The newest iPhone on the newest runtime the runner image's Xcode ships (see the script for the rules).
          DEVICE="$(scripts/latest-iphone-simulator.sh)"
          xcodebuild test -scheme ZDTaffy-Package -only-testing:ZDLayoutTests -destination "id=$DEVICE"

      - name: Build for iOS Simulator
        run: xcodebuild -scheme ZDTaffy -destination 'generic/platform=iOS Simulator' build

      - name: Build the demo app
        run: |
          brew install xcodegen
          (cd Demo && xcodegen generate)
          xcodebuild -project Demo/ZDLayoutDemo.xcodeproj -scheme ZDLayoutDemo \
            -destination 'generic/platform=iOS Simulator' build
