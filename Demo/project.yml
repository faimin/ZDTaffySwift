name: ZDLayoutDemo
options:
  bundleIdPrefix: dev.zd
  deploymentTarget:
    iOS: "15.0"
packages:
  ZDTaffy:
    path: ..
targets:
  ZDLayoutDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: ZDTaffy
        product: ZDLayout
      - package: ZDTaffy
        product: ZDLayoutCore
      - package: ZDTaffy
        product: ZDLayoutSwiftUI
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zd.ZDLayoutDemo
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
