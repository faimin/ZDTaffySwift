experimental = []

[cargo]
global_args = []

[package]
name = "zd_taffy"

[targets.apple]
enabled = true
output = "dist/apple"
deployment_target = "15.0"
include_macos = true

[targets.apple.swift]
module_name = "ZDTaffy"
tools_version = "6.0"
error_style = "throwing"

[targets.apple.spm]
distribution = "local"
layout = "split"

[targets.android]
enabled = false

[targets.wasm]
enabled = false
